{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}费用分摊{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="bg-light">

{% block navbar %}
<nav class="navbar navbar-expand navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/groups/">费用分摊</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-white-50 small" id="nav-username"></span>
      <button type="button" class="btn btn-sm btn-outline-light" onclick="API.logout()">退出</button>
    </div>
  </div>
</nav>
{% endblock %}

<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/api.js' %}"></script>
<script>
  (function () {
    var element = document.getElementById("nav-username");
    if (element) {
      element.textContent = localStorage.getItem("username") || "";
    }
  })();
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
